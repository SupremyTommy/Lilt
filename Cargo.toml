[package]
name = "lilt-player"
version = "0.2.7"
edition = "2021"

[dependencies]
directories = "6"
eframe = "0.31"
egui_extras = { version = "0.31.1", features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lofty = "0.22"
rfd = "0.15"
rodio = { version = "0.20.1", features = ["symphonia-all"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
souvlaki = "0.7.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Security_Credentials"] }
